<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PostKit</title>
    <link rel="stylesheet" href="css/panel.css" />
  </head>
  <body>
    <header class="top">
      <button id="home-btn" class="back" hidden aria-label="Back to the editor">‹ Editor</button>
      <span class="mark">PostKit<i aria-hidden="true"></i></span>
      <span id="credits" class="credits" hidden title="AI credits"></span>
      <button id="account-btn" class="link" hidden>Account</button>
    </header>

    <!-- Sign in -->
    <section id="view-signin" class="view" hidden>
      <h1>Sign in</h1>
      <p class="muted">Use the email you bought PostKit with. We'll send you a code.</p>
      <form id="form-email" class="stack">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
        <button class="primary" type="submit">Email me a code</button>
      </form>
      <form id="form-code" class="stack" hidden>
        <p class="muted" id="code-sent"></p>
        <label for="code">Code from the email</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required />
        <button class="primary" type="submit">Sign in</button>
        <button class="link" type="button" id="change-email">Use a different email</button>
      </form>
    </section>

    <!-- The AI editor, then every tool -->
    <section id="view-home" class="view" hidden>
      <p class="seq-line"><span class="muted">Sequence</span> <strong id="seq-name">No sequence open</strong> <button class="link" id="refresh">Refresh</button></p>
      <div id="ai-home"></div>
      <div id="tool-groups"></div>
    </section>

    <!-- One tool at a time -->
    <section id="view-tool" class="view" hidden>
      <h1 id="tool-title"></h1>
      <div class="source" id="source"></div>
      <div id="tool-body"></div>
    </section>

    <!-- Your taste -->
    <section id="view-taste" class="view" hidden>
      <h1>Your taste</h1>
      <div id="taste-body"></div>
    </section>

    <!-- Account -->
    <section id="view-account" class="view" hidden>
      <h1>Account</h1>
      <dl class="facts">
        <dt>Signed in as</dt><dd id="acc-email"></dd>
        <dt>Plan active until</dt><dd id="acc-until"></dd>
        <dt>AI credits</dt><dd id="acc-credits"></dd>
        <dt>Version</dt><dd id="acc-version"></dd>
      </dl>
      <label>Graphics are rendered as
        <select id="codec">
          <option value="prores">ProRes 4444 (best quality)</option>
          <option value="qtrle">Animation (faster, smaller)</option>
        </select>
      </label>
      <div class="actions">
        <button class="secondary" id="back">Back</button>
        <button class="secondary" id="sign-out">Sign out</button>
      </div>
      <p class="muted">Manage your plan, computers and credits at postkitlb.com/account.</p>
    </section>

    <footer class="status" id="status" role="status" aria-live="polite"></footer>

    <script src="js/gfx/engine.js"></script>
    <script src="js/gfx/fonts.js"></script>
    <script src="js/gfx/templates.js"></script>
    <script src="js/gfx/captionstyles.js"></script>
    <script src="js/gfx/validate.js"></script>
    <script src="js/core.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/tools/edit.js"></script>
    <script src="js/tools/text.js"></script>
    <script src="js/tools/audio.js"></script>
    <script src="js/tools/library.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
